<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>创建账户 · 临港 OPC</title><link rel="stylesheet" href="/styles.css"><link rel="stylesheet" href="/auth.css"></head><body class="portal-home"><main class="auth-shell"><a class="back-link" href="/">← 返回首页</a><section class="auth-card"><div class="home-brand"><div class="brand-mark">O</div><div><b>临港 OPC 联合体</b><small>DELIVERY DESK</small></div></div><p class="eyebrow auth-eyebrow">CREATE PARTICIPANT ACCOUNT</p><h1>创建账户</h1><p class="auth-lead">一个账户可以同时使用请求者和工作者工作台。</p><div class="role-picker"><button type="button" class="role-choice selected" data-role="requester"><b>我是请求者</b><small>发布企业需求，组织项目验收</small></button><button type="button" class="role-choice" data-role="worker"><b>我是工作者</b><small>展示技能案例，参与团队交付</small></button><button type="button" class="role-choice" data-role="both"><b>两种身份都有</b><small>同一账户管理需求并参与交付</small></button></div><form id="registerForm"><input type="hidden" name="role" value="requester"><label>姓名或称呼<input name="displayName" minlength="2" maxlength="80" autocomplete="name" required></label><label>邮箱<input name="email" type="email" maxlength="254" autocomplete="email" required></label><label class="requester-field">企业或团队名称<input name="organizationName" maxlength="120" required></label><label class="worker-field hidden">技能方向<input name="skills" maxlength="500"></label><label class="worker-field hidden">每周可投入时间<input name="availability" maxlength="200" placeholder="例如：每周约 20 小时"></label><label class="worker-field hidden">作品或案例链接 <span class="optional">选填</span><input name="portfolioUrl" type="url" maxlength="500" placeholder="https://example.com"></label><label>密码<input name="password" type="password" minlength="8" maxlength="200" autocomplete="new-password" required><small class="field-help">至少 8 个字符</small></label><label>确认密码<input name="confirmPassword" type="password" minlength="8" maxlength="200" autocomplete="new-password" required></label><p class="auth-note">密码经 scrypt 哈希后保存。平台不保存明文密码。</p><button class="primary auth-submit" type="submit">创建请求者账户</button></form><div id="authResult" class="auth-result" role="status" aria-live="polite"></div><p class="auth-switch">已有账户？<a href="/login.html">登录</a></p></section><footer class="home-footer">临港 OPC 履约协作平台 · 独立演示版</footer></main><script src="/register.js" defer></script></body></html>
