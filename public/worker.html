<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>工作者工作台 · OPC 联合体</title><link rel="stylesheet" href="/styles.css?v=20261022-header-actions"></head><body><div class="role-app"><header class="role-header"><button type="button" class="logout-action header-logout" id="logoutButton">退出登录</button><div class="role-heading"><p class="eyebrow">WORKER WORKSPACE</p><h1>工作者工作台</h1><p>浏览项目、报名协作，并提交阶段交付。</p></div><div class="role-actions"><span class="role-chip worker-chip" id="currentAccount">工作者</span><a class="secondary workspace-switch" id="switchWorkspace" href="/requester" hidden>请求者工作台 ↗</a><a href="/" class="role-entry-link">返回角色入口</a></div></header><section class="worker-welcome" id="welcome"></section><div class="role-body"><section><div class="role-section-head"><div><p class="eyebrow">WORK OPPORTUNITIES</p><h2>项目与我的协作</h2></div><button class="small-button" id="refreshOrders">刷新项目</button><select id="workerFilter"><option value="all">全部项目</option><option value="recruiting">招募中</option><option value="mine">我参与的项目</option></select></div><div id="workerOrders" class="role-order-list"></div></section><aside class="role-aside"><div class="role-aside-card"><div class="role-aside-mark worker-mark">02</div><p class="eyebrow">WORKER FLOW</p><h3>从报名到交付</h3><ol><li><b>找到合适工单</b><small>查看需求、预算与交付日期</small></li><li><b>提交技能和案例</b><small>让请求者了解你的匹配度</small></li><li><b>确认团队总价</b><small>团队负责人复核总价约定</small></li><li><b>提交节点交付物</b><small>粘贴预览链接或说明交付内容</small></li></ol></div><div class="role-aside-note">报名、团队确认和交付记录会归属于当前登录的工作者账户，并同步显示在请求者工作台。</div></aside></div><footer class="role-footer">工作者工作台 <span>·</span> 操作结果会同步到请求者工作台</footer></div><dialog id="detailDialog"><div id="detailContent"></div></dialog><div class="toast" id="toast"></div><script src="/worker.js" defer></script></body></html>
